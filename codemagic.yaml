workflows:
  ios-workflow:
    name: Ustun Dokon iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - supabase_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: .env faylini yaratish
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
      - name: Paketlarni o'rnatish
        script: flutter pub get
      - name: iOS build (imzosiz)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  android-workflow:
    name: Ustun Dokon Android
    max_build_duration: 30
    instance_type: linux_x2
    working_directory: app
    environment:
      flutter: stable
      groups:
        - supabase_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: .env faylini yaratish
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
      - name: Paketlarni o'rnatish
        script: flutter pub get
      - name: Android APK build (faqat arm64 — hajmni kamaytirish uchun)
        script: flutter build apk --release --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
